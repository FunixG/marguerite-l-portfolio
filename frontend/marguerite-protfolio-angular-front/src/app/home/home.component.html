<div class="home-container">
    <div class="projects-grid">
        <div class="project-column left-column">
            @for (project of leftList; track project.id) {
                <div class="project-card card-animated"
                     (click)="openProject(project)"
                     [style.--delay]="($index * 300) + 'ms'"
                >
                    <div class="card-image-wrapper">
                        <img
                            [src]="mediasService.getMediaThumbnailUrl(project.coverMediaId)"
                            [alt]="project.title"
                            class="card-image"
                        />
                    </div>
                    <div class="card-label">
                        <span>{{ project.title }}</span>
                    </div>
                </div>
            }

            @for (slot of leftPlaceholders; track $index) {
                <div class="project-filler"
                     [style.background]="slot.color"
                     [style.--delay]="($index * 300) + 'ms'"
                ></div>
            }
        </div>

        <div class="project-column right-column">
            @for (project of rightList; track project.id) {
                <div class="project-card card-animated"
                     (click)="openProject(project)"
                     [style.--delay]="($index * 300 + 60) + 'ms'"
                >
                    <div class="card-image-wrapper">
                        <img
                            [src]="mediasService.getMediaThumbnailUrl(project.coverMediaId)"
                            [alt]="project.title"
                            class="card-image"
                        />
                    </div>
                    <div class="card-label">
                        <span>{{ project.title }}</span>
                    </div>
                </div>
            }

            @for (slot of rightPlaceholders; track $index) {
                <div class="project-filler"
                     [style.background]="slot.color"
                     [style.--delay]="($index * 300 + 60) + 'ms'"
                ></div>
            }
        </div>
    </div>

    @if (hasMore) {
        <div class="load-more-wrapper">
            <button class="load-more-btn" (click)="nextPage()">Voir plus</button>
        </div>
    }
</div>
